# CPU PILOT: loss-threshold attack only. Recipe matches target_regularized_cpu.yaml.
extends: base.yaml
target_run_name: target_regularized_cpu

data:
  target_train_size: 2000
  target_holdout_size: 2000
  shadow_pool_size: 5000
  attacker_aux_size: 2000
  num_workers: 0

model:
  name: simple_cnn
  dropout: 0.3

train:
  epochs: 30
  lr: 0.001
  weight_decay: 0.0005
  early_stopping_patience: 5
